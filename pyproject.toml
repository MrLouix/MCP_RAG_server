[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rag-server"
version = "0.1.0"
description = "Local MCP RAG server with auto-tagging, watch folder, and lazy model loading"
requires-python = ">=3.10"
dependencies = [
    "langchain-text-splitters>=0.3.0",
    "mcp>=1.20",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "llama-cpp-python>=0.3.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "easyocr>=1.7.0",
    "Pillow>=10.0.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "watchdog>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mcp-rag-server = "mcp_rag.server:main"
mcp-rag-ingest = "scripts.ingest_cli:main"
mcp-rag-tag = "scripts.tag_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_rag*", "scripts*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mcp_rag --cov-report=term-missing --cov-fail-under=20"
