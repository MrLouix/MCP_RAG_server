[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rag-server"
version = "0.1.0"
description = "Local MCP RAG server with auto-tagging, watch folder, and lazy model loading"
requires-python = ">=3.10"
dependencies = [
    "langchain-text-splitters>=0.3.0",
    "mcp>=1.20",
    "uvicorn>=0.28.0",
    "starlette>=0.40.0",
    "chromadb>=0.6.0",
    # ONNX Runtime + tokenizers ONLY — no PyTorch, no CUDA, no optimum (only 3 packages)
    "onnxruntime>=1.18.0",
    "tokenizers>=0.20.0",
    "huggingface_hub>=0.24.0",
    # CPU-only — no torch, no CUDA
    "PyMuPDF>=1.24.0",
    # easyocr removed — pulls torch + CUDA (~1.5 GB), not needed for basic PDF
    "pdfplumber>=0.11.0",
    # llama-cpp-python removed — pulls CUDA bindings + compile chain (~200 MB), 
    # H2 tagging replaced with lightweight keyword heuristics
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Watch folder
    "watchdog>=4.0.0",
    # Config & utils
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mcp-rag-server = "mcp_rag.server:main"
mcp-rag-ingest = "scripts.ingest_cli:main"
mcp-rag-tag = "scripts.tag_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_rag*", "scripts*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mcp_rag --cov-report=term-missing --cov-fail-under=20"
