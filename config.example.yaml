ollama:
  base_url: "http://172.28.128.1:11434"
  embed_model: "nomic-embed-text"
  tag_model: "qwen2.5:3b"
  vision_model: "minicpm-v"
  timeout_s: 30
  embed_timeout_s: 120
  max_retries: 3
  auto_pull: false

rag:
  index_path: "./rag_index"
  chunk_size: 600
  chunk_overlap: 60
  max_chunks_per_doc: 1500
  ocr_enabled: true
  ocr_languages: ["fra", "eng"]
  supported_extensions:
    - .pdf
    - .png
    - .jpg
    - .jpeg
    - .txt
    - .md
    - .markdown
    - .docx
    - .csv
    - .xlsx

tagging:
  auto_tag_enabled: true
  timeout_ms: 30000
  use_cache: true
  cache_path: ".rag_tag_cache.db"
  taxonomy:
    domaine: ["financier", "juridique", "technique", "commercial", "rh", "administratif"]
    priorite: ["urgent", "normal", "faible"]
    langue: "ISO 639-1"
    entites: ["array", "string"]
    confidentialite: ["public", "interne", "confidentiel"]
  temperature: 0.1
  seed: 42

watcher:
  enabled: false
  debounce_ms: 2000
  sync_deletions: true
  max_workers: 4
  default_watch_paths: []
  default_recursive: true

security:
  ragrules_max_bytes: 102400
  regex_timeout_ms: 200
  yaml_safe_load_only: true

logging:
  level: "INFO"
  format: "json"
  file: "./logs/mcp_rag.log"
  rotation: "50MB"
  retention_days: 14
